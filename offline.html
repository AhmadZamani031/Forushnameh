<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#103b86">
<script>
(function(){
  try {
    var mode=localStorage.getItem("forushnameh.theme")==="dark"?"dark":"light";
    document.documentElement.dataset.theme=mode;
  } catch(e) { document.documentElement.dataset.theme="light"; }
})();
</script>
<title>اتصال اینترنت در دسترس نیست | فروش‌نامه</title>
<link rel="icon" href="./logo-forushnameh.svg" type="image/svg+xml">
<style>
:root{color-scheme:light;--bg:#f3f6fb;--panel:#fff;--ink:#17263b;--muted:#66768d;--border:#e2e9f2;--blue:#103b86}
:root[data-theme="dark"]{color-scheme:dark;--bg:#101a2b;--panel:#19283e;--ink:#e7eef9;--muted:#adbbce;--border:#354963;--blue:#a9caff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:Tahoma,sans-serif;padding:20px;transition:background .2s,color .2s}
.card{max-width:460px;width:100%;text-align:center;background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:30px;box-shadow:0 12px 35px #103b8610}
img{width:76px;height:76px;object-fit:contain}
h1{font-size:21px;color:var(--blue)}
p{font-size:14px;line-height:2;color:var(--muted)}
.actions{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap}
button{border:0;border-radius:10px;background:#103b86;color:#fff;padding:12px 22px;font:inherit;cursor:pointer}
.theme-toggle{width:42px;height:42px;padding:0;display:grid;place-items:center;background:var(--panel);border:1px solid var(--border);color:var(--ink)}
.theme-toggle svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.theme-toggle .sun{display:none}
:root[data-theme="dark"] .theme-toggle .moon{display:none}
:root[data-theme="dark"] .theme-toggle .sun{display:block}
button:focus-visible{outline:3px solid #83b6f5;outline-offset:3px}
</style>
<script>
/* Replace the old controlling worker with a no-fetch worker, then reload the app. */
(async function(){
 const params=new URLSearchParams(location.search);
 if(params.has("sw-retired"))return;
 const status=document.querySelector(".card p");
 const refresh=document.querySelector(".actions button");
 if(status)status.textContent="در حال بازیابی برنامه؛ لطفاً چند لحظه صبر کنید…";
 if(refresh)refresh.disabled=true;
 try{
  if("serviceWorker" in navigator){
   const registration=await navigator.serviceWorker.register("./service-worker-retire.js",{scope:"./",updateViaCache:"none"});
   await registration.update().catch(()=>{});
   const active=registration.installing||registration.waiting||registration.active;
   if(active&&active.state!=="activated"){
    await new Promise((resolve,reject)=>{
     const worker=registration.installing||registration.waiting||registration.active;
     if(!worker){resolve();return}
     const done=()=>{if(worker.state==="activated"){worker.removeEventListener("statechange",done);resolve()}else if(worker.state==="redundant"){worker.removeEventListener("statechange",done);reject(new Error("Worker update failed"))}};
     worker.addEventListener("statechange",done);
     done();
     setTimeout(()=>reject(new Error("Worker update timed out")),12000);
    });
   }
   await navigator.serviceWorker.ready;
   await new Promise(resolve=>{
    if(navigator.serviceWorker.controller?.scriptURL.includes("service-worker-retire.js")){resolve();return}
    const done=()=>{if(navigator.serviceWorker.controller?.scriptURL.includes("retire=20261110")){navigator.serviceWorker.removeEventListener("controllerchange",done);resolve()}};
    navigator.serviceWorker.addEventListener("controllerchange",done);
    setTimeout(()=>{navigator.serviceWorker.removeEventListener("controllerchange",done);resolve()},5000);
   });
  }
  if("caches" in window){
   const keys=await caches.keys();
   await Promise.all(keys.filter(key=>key.toLowerCase().includes("forushnameh")).map(key=>caches.delete(key)));
  }
  const target=new URL("./index.html",location.href);
  target.searchParams.set("sw-retired","1");
  target.searchParams.set("t",String(Date.now()));
  location.replace(target.href);
 }catch(error){
  if(status)status.textContent="بازیابی خودکار انجام نشد. لطفاً دکمه تلاش دوباره را بزنید یا صفحه را در زبانه جدید باز کنید.";
  if(refresh)refresh.disabled=false;
  console.error("Forushnameh worker recovery failed",error);
 }
})();
</script>

</head>
<body>
<main class="card">
<img src="./logo-forushnameh.svg" alt="فروش‌نامه">
<h1>اتصال اینترنت برقرار نیست</h1>
<p>پوسته فروش‌نامه روی دستگاه در دسترس است، اما ورود به حساب و مشاهده یا ثبت اطلاعات به اتصال اینترنت نیاز دارد. پس از برقراری اتصال دوباره تلاش کنید.</p>
<div class="actions">
<button type="button" onclick="location.reload()">تلاش دوباره</button>
<button class="theme-toggle" type="button" id="themeToggle" aria-label="فعال‌سازی تم تاریک" aria-pressed="false" title="تغییر تم">
<svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 15.1A8.5 8.5 0 0 1 8.9 3.8 8.7 8.7 0 1 0 20.2 15.1Z"/></svg>
<svg class="sun" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 1.75v2.1M12 20.15v2.1M4.75 4.75l1.5 1.5m11.5 11.5 1.5 1.5M1.75 12h2.1m16.3 0h2.1M4.75 19.25l1.5-1.5m11.5-11.5 1.5-1.5"/></svg>
</button>
</div>
</main>
<script>
(function(){
 const root=document.documentElement,button=document.getElementById("themeToggle"),meta=document.querySelector('meta[name="theme-color"]');
 function apply(mode){root.dataset.theme=mode;button.setAttribute("aria-pressed",String(mode==="dark"));button.setAttribute("aria-label",mode==="dark"?"فعال‌سازی تم روشن":"فعال‌سازی تم تاریک");if(meta)meta.content=mode==="dark"?"#101a2b":"#103b86"}
 apply(root.dataset.theme==="dark"?"dark":"light");
 button.addEventListener("click",function(){const next=root.dataset.theme==="dark"?"light":"dark";try{localStorage.setItem("forushnameh.theme",next)}catch(e){}apply(next)});
})();
</script>
</body>
</html>
